<style>
  :root{
    --bg:#111318; --card:#1B1E26; --card-border:#2A2E38;
    --gold:#F2A93B; --gold-dim:#8a6420; --sky:#4FA8D8;
    --text:#EDEEF2; --muted:#8B8F98; --green:#4CAF6D; --red:#E3584B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; max-width:430px; margin:0 auto; min-height:100vh; padding-bottom:90px; }
  header{ padding:22px 18px 16px; border-bottom:1px solid var(--card-border); position:sticky; top:0; background:var(--bg); z-index:10; }
  .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:600; }
  h1{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:30px; margin:2px 0 0; letter-spacing:.01em; }
  .elevation{ display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); margin-top:6px; }
  .elevation .num{ color:var(--gold); font-weight:700; font-family:'Barlow Condensed',sans-serif; font-size:13px; }
  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:16px 18px 4px; }
  .stat{ background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:12px 10px; text-align:center; }
  .stat .n{ font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:700; }
  .stat .l{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
  .filters{ display:flex; gap:8px; padding:14px 18px 6px; overflow-x:auto; }
  .filter{ flex:0 0 auto; font-size:12px; padding:7px 13px; border-radius:20px; border:1px solid var(--card-border); color:var(--muted); font-weight:600; white-space:nowrap; }
  .filter.active{ background:var(--gold); color:#1a1300; border-color:var(--gold); }
  .list{ padding:8px 18px 0; }
  .card{ background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:16px; margin-bottom:12px; }
  .card.emergency{ border-color:var(--red); }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .biz-name{ font-weight:700; font-size:16px; }
  .niche{ font-size:12px; color:var(--muted); margin-top:2px; }
  .status{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:4px 9px; border-radius:20px; white-space:nowrap; }
  .status.new{ background:rgba(242,169,59,.15); color:var(--gold); }
  .status.contacted{ background:rgba(79,168,216,.15); color:var(--sky); }
  .status.demo{ background:rgba(76,175,109,.15); color:var(--green); }
  .status.warm{ background:rgba(199,124,147,.15); color:#c97c93; }
  .status.emergency{ background:rgba(227,88,75,.18); color:var(--red); }
  .card-actions{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; margin-top:14px; }
  .btn.email{ background:var(--red); border-color:var(--red); color:#2a0e0a; }
  .btn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:12px 4px; border-radius:12px; text-decoration:none; font-size:11px; font-weight:700; min-height:44px; border:1px solid var(--card-border); color:var(--text); }
  .btn.call{ background:var(--red); border-color:var(--red); color:#2a0e0a; }
  .btn.text{ background:var(--red); border-color:var(--red); color:#2a0e0a; }
  .btn.demo{ background:transparent; color:var(--gold); border-color:var(--gold-dim); }
  nav{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:#161822; border-top:1px solid var(--card-border); display:flex; padding:10px 8px calc(10px + env(safe-area-inset-bottom)); }
  nav a{ flex:1; text-align:center; font-size:11px; color:var(--muted); text-decoration:none; font-weight:600; padding:6px 0; }
  nav a.active{ color:var(--gold); }

  /* ---- Content tab (Shorts + posts copy/paste) ---- */
  .c-intro{ font-size:13px; color:var(--muted); margin:2px 0 14px; line-height:1.5; }
  .c-h{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:20px; color:var(--gold); margin:18px 0 8px; letter-spacing:.02em; }
  .c-title{ font-weight:700; font-size:16px; }
  .c-meta{ font-size:12px; color:var(--muted); margin:2px 0 8px; }
  .c-lab{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--sky); margin:12px 0 4px; }
  .c-box{ white-space:pre-wrap; word-break:break-word; background:#12151c; border:1px solid var(--card-border); border-left:3px solid var(--gold); border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.5; margin:0 0 6px; }
  .c-copy{ width:100%; min-height:44px; border-radius:10px; border:1px solid var(--gold-dim); background:transparent; color:var(--gold); font:700 14px 'Inter',sans-serif; }
  .c-copy.done{ background:var(--green); border-color:var(--green); color:#07130b; }
  .c-list{ margin:0; padding-left:20px; font-size:13px; line-height:1.6; }

  /* ---- Flagship bar: Tapsag.shop is always first, on every tab ---- */
  .flag{ display:flex; align-items:center; gap:12px; margin:12px 18px 0; min-height:56px; padding:8px 14px; border-radius:14px; border:1px solid var(--gold); background:linear-gradient(135deg,rgba(242,169,59,.18),rgba(242,169,59,.05)); text-decoration:none; color:var(--text); }
  .flag-star{ font-size:22px; color:var(--gold); }
  .flag-txt{ flex:1; display:flex; flex-direction:column; line-height:1.25; }
  .flag-txt b{ font-family:'Barlow Condensed',sans-serif; font-size:20px; letter-spacing:.02em; }
  .flag-txt span{ font-size:11px; color:var(--muted); }
  .flag-go{ font-size:13px; font-weight:700; color:var(--gold); }
  .card.flagship{ border-color:var(--gold); }

  /* ---- Daily Briefing ---- */
  .b-hi{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:28px; margin:4px 0 0; }
  .b-date{ font-size:12px; color:var(--muted); margin:2px 0 14px; }
  .b-h{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:20px; color:var(--gold); margin:0 0 10px; letter-spacing:.02em; }
  .b-row{ display:flex; align-items:center; gap:12px; min-height:44px; padding:6px 0; border-bottom:1px solid var(--card-border); font-size:14px; line-height:1.35; }
  .b-row:last-child{ border-bottom:none; }
  .b-row.done .b-txt{ color:var(--muted); text-decoration:line-through; }
  .b-chk{ flex:0 0 28px; width:28px; height:28px; border-radius:8px; border:2px solid var(--gold-dim); background:transparent; color:#07130b; font-size:16px; font-weight:800; padding:0; }
  .b-row.done .b-chk{ background:var(--green); border-color:var(--green); }
  .b-txt{ flex:1; }
  .b-pill{ flex:0 0 auto; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:4px 9px; border-radius:20px; white-space:nowrap; }
  .b-ok{ background:rgba(76,175,109,.15); color:var(--green); }
  .b-wait{ background:rgba(242,169,59,.15); color:var(--gold); }
  .b-off{ background:rgba(139,143,152,.15); color:var(--muted); }
  .b-bad{ background:rgba(227,88,75,.18); color:var(--red); }
  .b-sub{ font-size:11px; color:var(--muted); }
  .b-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:6px; }
  .b-grid .stat{ padding:10px 4px; }
  .b-go{ display:flex; align-items:center; justify-content:center; min-height:44px; border-radius:12px; border:1px solid var(--gold-dim); color:var(--gold); font-weight:700; font-size:13px; text-decoration:none; width:100%; background:transparent; margin-top:8px; }
  .b-call{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; min-width:44px; min-height:44px; border-radius:12px; background:var(--red); color:#2a0e0a; text-decoration:none; font-size:18px; }
  .b-add{ display:flex; gap:8px; margin-top:10px; }
  .b-add input{ flex:1; min-height:44px; border-radius:10px; border:1px solid var(--card-border); background:#12151c; color:var(--text); padding:0 12px; font:500 14px 'Inter',sans-serif; }
  .b-add button{ min-width:64px; min-height:44px; border-radius:10px; border:1px solid var(--gold-dim); background:transparent; color:var(--gold); font:700 13px 'Inter',sans-serif; }
  .b-note{ font-size:11px; color:var(--muted); line-height:1.5; padding:4px 2px 14px; }
</style>

function statusLabel(s){ return {new:"New", contacted:"Contacted", demo:"Demo Ready"}[s] || s; }

function cardHtml(p, isWarm){
  const smsHref = p.phone ? `sms:${p.phone}${/iPhone|iPad|iPod/i.test(navigator.userAgent) ? '&' : '?'}body=${encodeURIComponent(p.smsBody + (p.demo ? ' ' + p.demo : ''))}` : '#';
  const callHref = p.phone ? `tel:${p.phone}` : '#';
  const emailHref = p.email ? `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(p.email)}&su=${encodeURIComponent('Free AI visibility audit + demo site for ' + p.name)}&body=${encodeURIComponent(p.smsBody + (p.demo ? '\n\n' + p.demo : '') + '\n\n— Elijah, Mile High AI')}&authuser=creationandthings@gmail.com` : '#';
  const statusClass = isWarm ? 'warm' : (p.emergency ? 'emergency' : p.status);
  const statusText = isWarm ? 'Warm Lead' : (p.emergency ? '🚨 Emergency' : statusLabel(p.status));
  return `
    <div class="card ${p.emergency ? 'emergency' : ''}">
      <div class="card-top">
        <div>
          <div class="biz-name">${p.name}</div>
          <div class="niche">${p.niche}</div>
        </div>
        <div class="status ${statusClass}">${statusText}</div>
      </div>
      <div class="card-actions">
        <a class="btn call" href="${callHref}">📞<span>${p.phone ? 'Call' : 'No #'}</span></a>
        <a class="btn text" href="${smsHref}">💬<span>Text</span></a>
        <a class="btn email" href="${emailHref}" style="${p.email ? '' : 'opacity:.35;pointer-events:none;'}">✉️<span>${p.email ? 'Email' : 'No email'}</span></a>
        ${p.demo ? `<a class="btn demo" href="${p.demo}" target="_blank">🔗<span>Demo</span></a>` : `<div class="btn demo" style="opacity:.35">🔗<span>No demo</span></div>`}
      </div>
    </div>`;
}

function render(filter){
  const list = document.getElementById('list');
  let filtered = prospects;
  if (filter === 'emergency') filtered = prospects.filter(p => p.emergency);
  else if (filter !== 'all') filtered = prospects.filter(p => p.status === filter);
  list.innerHTML = filtered.map(p => cardHtml(p, false)).join('');
  document.getElementById('stat-new').textContent = prospects.filter(p=>p.status==='new').length;
  document.getElementById('stat-demo').textContent = prospects.filter(p=>p.demo).length;
  document.getElementById('stat-warm').textContent = warmLeads.length;
}

function renderWarm(){
  document.getElementById('warm-list').innerHTML = warmLeads.map(p => cardHtml(p, true)).join('');

document.querySelectorAll('.filter').forEach(f => {

    document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));
    f.classList.add('active');
    render(f.dataset.f);
  });
});

function showView(view){
  document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('active', x.dataset.view === view));
  document.getElementById('briefing-list').style.display = view === 'briefing' ? '' : 'none';
  document.getElementById('stats').style.display = view === 'briefing' ? 'none' : '';
  document.getElementById('list').style.display = view === 'pipeline' ? '' : 'none';
  document.getElementById('warm-list').style.display = view === 'warm' ? '' : 'none';
  document.getElementById('pipeline-filters').style.display = view === 'pipeline' ? 'flex' : 'none';
  document.getElementById('content-list').style.display = view === 'content' ? '' : 'none';
  window.scrollTo(0,0);
}
document.querySelectorAll('nav a').forEach(a => {

});

  var seeAll = el('a','b-go','See full pipeline'); seeAll.href='#'; seeAll.onclick=function(e){ e.preventDefault(); showView('pipeline'); }; c2.appendChild(seeAll);

  /* 3. Pipeline numbers (computed, not typed) */
  var c3 = card("Pipeline");
  var g = el('div','b-grid');
  [[prospects.length,'Prospects'],[prospects.filter(function(p){return p.status==='demo';}).length,'Demo ready'],[prospects.filter(function(p){return p.emergency;}).length,'Hail'],[warmLeads.length,'Warm']].forEach(function(x){
    var s=el('div','stat'); s.appendChild(el('div','n',String(x[0]))); s.appendChild(el('div','l',x[1])); g.appendChild(s);
  });
  c3.appendChild(g);
  c3.appendChild(el('div','b-sub','Contacted: 0 recorded. Replies and deals are not tracked here yet.'));

  /* 4. Tapsag status. Hand-set and dated; only the site check is live. */
  var c4 = card("Tapsag.shop");
  var siteRow = row('Website','Checking…','b-off','…'); c4.appendChild(siteRow);
  c4.appendChild(row('Email delivery','Verify tapsag.shop domain in Resend before customer delivery','b-wait','Verify Resend'));
  c4.appendChild(row('SMS Text','Locked as Coming Soon on Nov 24 while Twilio is finished','b-wait','Coming Soon'));
  c4.appendChild(row('Stripe checkout','Not tested end to end','b-wait','Untested'));
  c4.appendChild(row('Background lock','Needs OWNER_KEY set in Netlify','b-wait','Set key'));

    siteRow.replaceWith(row('Website','Reachable just now','b-ok','Live'));
  }).catch(function(){
    siteRow.replaceWith(row('Website','Could not reach it from this phone','b-bad','Check'));
  });
  var toC = el('a','b-go','Open Shorts and posts'); toC.href='#'; toC.onclick=function(e){ e.preventDefault(); showView('content'); }; c4.appendChild(toC);
  c4.classList.add('flagship');
  box.insertBefore(c4, c1); /* Tapsag.shop is always the first card */

  /* 5. Not connected yet (shown honestly, no made-up numbers) */
  var c5 = card("Not connected yet");
  c5.appendChild(row('Fiverr / Upwork / LinkedIn requests','No feed connected','b-off','Empty'));
  c5.appendChild(row('Google Maps business discovery','No feed connected','b-off','Empty'));
  c5.appendChild(row('Revenue and customers','None recorded','b-off','Empty'));

  box.appendChild(el('div','b-note','Real data only. Pipeline numbers come from this app’s records. Tapsag statuses are set by hand and change when you tell Claude something changed. Your checklist is saved on this phone, one list per day.'));
})();

/* ===== Shared Briefing feed: GitHub is the source of truth; phone cache is fallback. ===== */
(function(){
  var target = document.getElementById('shared-briefing');
  var endpoint = new URL('./briefing.json', window.location.href).toString();
  var cacheKey = 'mh-shared-briefing-v1';
  function node(tag, cls, value){ var n=document.createElement(tag); if(cls) n.className=cls; if(value!=null) n.textContent=value; return n; }
  function render(data){
    target.innerHTML = '';
    var head = node('div','b-h','Shared team briefing');
    target.appendChild(head);
    if(data.priority) target.appendChild(node('div','b-sub','Priority: '+data.priority));
    var stamp = data.updated ? new Date(data.updated) : null;
    target.appendChild(node('div','b-date','Updated '+(stamp && !isNaN(stamp.getTime()) ? stamp.toLocaleString() : 'time unavailable')));
    (Array.isArray(data.cards) ? data.cards : []).forEach(function(item){
      var c=node('div','card');
      var top=node('div','card-top');
      top.appendChild(node('div','biz-name',item.title || 'Untitled'));
      var status=(item.status || 'todo').toLowerCase();
      var cls=status==='done'?'b-ok':status==='doing'?'b-wait':status==='blocked'?'b-bad':'b-off';
      top.appendChild(node('span','b-pill '+cls,status));
      c.appendChild(top);
      if(item.detail) c.appendChild(node('div','niche',item.detail));
      var meta=[item.who ? 'Who: '+item.who : '', item.updated ? 'Updated: '+new Date(item.updated).toLocaleString() : ''].filter(Boolean).join(' · ');
      if(meta) c.appendChild(node('div','b-sub',meta));
      target.appendChild(c);
    });
    if(!Array.isArray(data.cards) || !data.cards.length) target.appendChild(node('div','b-sub','No shared cards yet.'));
  }
  function fallback(){
    try{ var saved=JSON.parse(localStorage.getItem(cacheKey)||'null'); if(saved) { render(saved); return true; } }catch(e){}
    return false;
  }
  function refresh(){
    return fetch(endpoint,{cache:'no-store'}).then(function(response){
      if(!response.ok) throw new Error('Briefing feed unavailable: '+response.status);
      return response.json();
    }).then(function(data){
      if(!data || !Array.isArray(data.cards)) throw new Error('Invalid briefing feed');
      try{ localStorage.setItem(cacheKey,JSON.stringify(data)); }catch(e){}
      render(data);
    }).catch(function(){
      if(!fallback()) target.textContent='Shared briefing is unavailable; the phone has no saved copy yet.';
    });
  }
  refresh();
  window.setInterval(refresh,5*60*1000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') refresh(); });
  window.addEventListener('pageshow',refresh);
})();

showView('briefing');
